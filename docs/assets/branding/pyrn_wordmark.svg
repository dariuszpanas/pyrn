<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 68" width="210" height="68" role="img" aria-label="PyRn wordmark">
  <title>PyRn</title>
  <style>
    .wordmark {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 50px;
      font-weight: 800;
      letter-spacing: -0.03em;
      fill: #141c1f;
    }
    .accent {
      fill: #b45309;
    }
    .flip-n {
      will-change: transform;
      animation: pyrn-svg-flip 10s ease-in-out infinite;
    }
    svg:hover .flip-n {
      animation-play-state: paused;
    }
    @keyframes pyrn-svg-flip {
      0%, 35% {
        transform: rotate(0deg);
        fill: #141c1f;
      }
      50%, 85% {
        transform: rotate(180deg);
        fill: #b45309;
      }
      100% {
        transform: rotate(360deg);
        fill: #141c1f;
      }
    }
    @media (prefers-color-scheme: dark) {
      .wordmark {
        fill: #e2e8ea;
      }
      .accent {
        fill: #f59e0b;
      }
      @keyframes pyrn-svg-flip {
        0%, 35% {
          transform: rotate(0deg);
          fill: #e2e8ea;
        }
        50%, 85% {
          transform: rotate(180deg);
          fill: #f59e0b;
        }
        100% {
          transform: rotate(360deg);
          fill: #e2e8ea;
        }
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .flip-n {
        animation: none;
      }
    }
  </style>
  <text class="wordmark" x="12" y="51">Py<tspan class="accent">R</tspan></text>
  <g transform="translate(124, 38)">
    <g class="flip-n">
      <text class="wordmark" x="0" y="13" text-anchor="middle">n</text>
    </g>
  </g>
</svg>
