<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 68" width="240" height="68" role="img" aria-label="PyRn wordmark">
  <title>PyRn</title>
  <style>
    .wm {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 50px;
      font-weight: 800;
      letter-spacing: -0.03em;
      fill: #141c1f;
    }
    .r-glyph {
      animation: svg-r 4.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    .u-glyph {
      transform-box: fill-box;
      transform-origin: center;
      animation: svg-u 4.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    .st-glyph {
      transform-box: fill-box;
      transform-origin: center;
      animation: svg-st 4.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    .n-glyph {
      transform-box: fill-box;
      transform-origin: center;
      animation: svg-n 4.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    @keyframes svg-r {
      0%, 26% { fill: #b45309; }
      42%, 100% { fill: #141c1f; }
    }
    @keyframes svg-st {
      0%, 24% { opacity: 1; fill: #b45309; transform: scaleY(1); }
      36%, 100% { opacity: 0; fill: #b45309; transform: scaleY(0); }
    }
    @keyframes svg-u {
      0%, 24% { opacity: 1; fill: #b45309; transform: translateX(0) scaleY(1); }
      38%, 62% { opacity: 1; fill: #141c1f; transform: translateX(0) scaleY(1); }
      74% { opacity: 0.35; fill: #b45309; transform: translateX(6px) scaleY(-1); }
      84%, 100% { opacity: 0; fill: #b45309; transform: translateX(8px) scaleY(-1); }
    }
    @keyframes svg-n {
      0%, 26% { opacity: 0; transform: translateX(0) scaleY(0); }
      38%, 62% { opacity: 1; fill: #141c1f; transform: translateX(0) scaleY(1); }
      75% { opacity: 1; fill: #b45309; transform: translateX(-29px) scaleY(1); }
      88%, 100% { opacity: 1; fill: #141c1f; transform: translateX(-29px) scaleY(1); }
    }
    @media (prefers-color-scheme: dark) {
      .wm { fill: #e2e8ea; }
      @keyframes svg-r {
        0%, 26% { fill: #f59e0b; }
        42%, 100% { fill: #e2e8ea; }
      }
      @keyframes svg-st {
        0%, 24% { opacity: 1; fill: #f59e0b; transform: scaleY(1); }
        36%, 100% { opacity: 0; fill: #f59e0b; transform: scaleY(0); }
      }
      @keyframes svg-u {
        0%, 24% { opacity: 1; fill: #f59e0b; transform: translateX(0) scaleY(1); }
        38%, 62% { opacity: 1; fill: #e2e8ea; transform: translateX(0) scaleY(1); }
        74% { opacity: 0.35; fill: #f59e0b; transform: translateX(6px) scaleY(-1); }
        84%, 100% { opacity: 0; fill: #f59e0b; transform: translateX(8px) scaleY(-1); }
      }
      @keyframes svg-n {
        0%, 26% { opacity: 0; transform: translateX(0) scaleY(0); }
        38%, 62% { opacity: 1; fill: #e2e8ea; transform: translateX(0) scaleY(1); }
        75% { opacity: 1; fill: #f59e0b; transform: translateX(-29px) scaleY(1); }
        88%, 100% { opacity: 1; fill: #e2e8ea; transform: translateX(-29px) scaleY(1); }
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .r-glyph { animation: none; }
      .u-glyph, .st-glyph { display: none; }
      .n-glyph { animation: none; opacity: 1; transform: translateX(-29px); }
    }
  </style>
  <text class="wm" x="12" y="51">Py</text>
  <text class="wm r-glyph" x="72" y="51">R</text>
  <text class="wm u-glyph" x="108" y="51">u</text>
  <text class="wm st-glyph" x="137" y="51">st</text>
  <text class="wm n-glyph" x="137" y="51">n</text>
</svg>
