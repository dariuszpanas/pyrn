<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 68" width="240" height="68" role="img" aria-label="PyRn wordmark">
  <title>PyRn</title>
  <style>
    .wm {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 50px;
      font-weight: 800;
      letter-spacing: -0.03em;
      fill: #141c1f;
    }
    .r-glyph {
      animation: svg-r 9.5s cubic-bezier(0.45, 0, 0.25, 1) infinite;
    }
    .pivot-n,
    .pivot-u,
    .st-glyph,
    .tail-n {
      transform-box: fill-box;
      transform-origin: center;
    }
    .pivot-n {
      animation: svg-pivot-n 9.5s cubic-bezier(0.45, 0, 0.25, 1) infinite;
    }
    .pivot-u {
      animation: svg-pivot-u 9.5s cubic-bezier(0.45, 0, 0.25, 1) infinite;
    }
    .st-glyph {
      animation: svg-st 9.5s cubic-bezier(0.45, 0, 0.25, 1) infinite;
    }
    .tail-n {
      animation: svg-tail-n 9.5s cubic-bezier(0.45, 0, 0.25, 1) infinite;
    }
    svg:hover .r-glyph,
    svg:hover .pivot-n,
    svg:hover .pivot-u,
    svg:hover .st-glyph,
    svg:hover .tail-n {
      animation-play-state: paused;
    }
    @keyframes svg-r {
      0%, 32% { fill: #141c1f; }
      40%, 56% { fill: #b45309; }
      64%, 100% { fill: #141c1f; }
    }
    @keyframes svg-pivot-n {
      0%, 32% { opacity: 1; transform: scaleY(1); }
      36.9% { opacity: 1; transform: scaleY(0.05); }
      37%, 99% { opacity: 0; transform: scaleY(1); animation-timing-function: step-end; }
      100% { opacity: 1; transform: scaleY(1); }
    }
    @keyframes svg-pivot-u {
      0%, 36.9% { opacity: 0; fill: #b45309; transform: scale(1, 0); }
      37% { opacity: 1; fill: #b45309; transform: scale(1, 0.05); }
      42%, 56% { opacity: 1; fill: #b45309; transform: scale(1, 1); }
      64%, 76% { opacity: 1; fill: #141c1f; transform: scale(1, 1); }
      83%, 100% { opacity: 0; fill: #141c1f; transform: scale(0.75, 0.75); }
    }
    @keyframes svg-st {
      0%, 32% { opacity: 0; fill: #b45309; transform: scaleY(0); }
      41%, 56% { opacity: 1; fill: #b45309; transform: scaleY(1); }
      63%, 100% { opacity: 0; fill: #b45309; transform: scaleY(0); }
    }
    @keyframes svg-tail-n {
      0%, 57% { opacity: 0; transform: translateX(0) scaleY(0); }
      64%, 76% { opacity: 1; transform: translateX(0) scaleY(1); }
      84%, 99% { opacity: 1; transform: translateX(-29px) scaleY(1); animation-timing-function: step-end; }
      100% { opacity: 0; transform: translateX(0) scaleY(0); }
    }
    @media (prefers-color-scheme: dark) {
      .wm { fill: #e2e8ea; }
      @keyframes svg-r {
        0%, 32% { fill: #e2e8ea; }
        40%, 56% { fill: #f59e0b; }
        64%, 100% { fill: #e2e8ea; }
      }
      @keyframes svg-pivot-u {
        0%, 36.9% { opacity: 0; fill: #f59e0b; transform: scale(1, 0); }
        37% { opacity: 1; fill: #f59e0b; transform: scale(1, 0.05); }
        42%, 56% { opacity: 1; fill: #f59e0b; transform: scale(1, 1); }
        64%, 76% { opacity: 1; fill: #e2e8ea; transform: scale(1, 1); }
        83%, 100% { opacity: 0; fill: #e2e8ea; transform: scale(0.75, 0.75); }
      }
      @keyframes svg-st {
        0%, 32% { opacity: 0; fill: #f59e0b; transform: scaleY(0); }
        41%, 56% { opacity: 1; fill: #f59e0b; transform: scaleY(1); }
        63%, 100% { opacity: 0; fill: #f59e0b; transform: scaleY(0); }
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .r-glyph, .pivot-n { animation: none; opacity: 1; transform: none; }
      .pivot-u, .st-glyph, .tail-n { display: none; }
    }
  </style>
  <text class="wm" x="12" y="51">Py</text>
  <text class="wm r-glyph" x="72" y="51">R</text>
  <text class="wm pivot-n" x="108" y="51">n</text>
  <text class="wm pivot-u" x="108" y="51">u</text>
  <text class="wm st-glyph" x="137" y="51">st</text>
  <text class="wm tail-n" x="137" y="51">n</text>
</svg>
