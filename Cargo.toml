[workspace]
resolver = "3"
members = [
    "crates/pyrn-core",
    "crates/pyrn-runner",
    "crates/pyrn-cli",
]
default-members = [
    "crates/pyrn-core",
    "crates/pyrn-runner",
    "crates/pyrn-cli",
]

[workspace.package]
version = "0.2.3"
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/dariuszpanas/pyrn"
keywords = ["pytest", "python", "testing", "tia", "runner"]
categories = ["command-line-utilities", "development-tools::testing"]

[workspace.dependencies]
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive", "env"] }
getrandom = "0.3"
ignore = "0.4"
num_cpus = "1.16"
rayon = "1.12"
rusqlite = { version = "0.40", features = ["bundled"] }
rustpython-parser = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "process", "signal"] }
toml = "1.2"
walkdir = "2.5"
pyrn-core = { version = "0.2.3", path = "crates/pyrn-core" }
pyrn-runner = { version = "0.2.3", path = "crates/pyrn-runner" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Compile bundled SQLite at -O2 in dev/test builds so WAL benchmarks & tests
# reflect realistic engine performance rather than unoptimized -O0 C code.
[profile.dev.package.libsqlite3-sys]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
