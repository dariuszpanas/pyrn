name: pyrn Test Runner
description: Run Python/pytest suites with Rust-powered Test Impact Analysis (TIA), BLAKE3 CAS caching, and sys.monitoring coverage
author: Dariusz Panas

inputs:
  command:
    description: "Subcommand to execute: run (default), plan, doctor, or config"
    required: false
    default: run
  repo:
    description: Target repository root directory
    required: false
    default: "."
  python:
    description: Python interpreter executable (auto-detects .venv when omitted)
    required: false
    default: ""
  workers:
    description: "Worker count for run: auto (physical cores + cgroup budget) or positive integer"
    required: false
    default: auto
  role:
    description: "Isolation role: verify (default in CI) or agent"
    required: false
    default: verify
  tier:
    description: "TIA confidence tier: strict, transitive, or full"
    required: false
    default: strict
  markers:
    description: Pytest marker expression (-m) for run
    required: false
    default: ""
  keyword:
    description: Pytest keyword expression (-k) for run
    required: false
    default: ""
  config-file:
    description: Explicit pytest configuration file (-c) for run
    required: false
    default: ""
  targets:
    description: Optional newline- or space-separated test files or directories for run
    required: false
    default: ""
  cov-sysmon:
    description: Enable built-in Python 3.12+ COVERAGE_CORE=sysmon coverage capture and shard merge (true/false)
    required: false
    default: "false"
  cov-out:
    description: Output path for merged --cov-sysmon .coverage file
    required: false
    default: ""
  tia:
    description: Enable symbol-level Test Impact Analysis for run (true/false)
    required: false
    default: "false"
  base:
    description: Git base ref for TIA symbol diffing (e.g. origin/main or HEAD)
    required: false
    default: ""
  changed:
    description: Explicit comma-separated repository-relative changed paths for TIA
    required: false
    default: ""
  cache:
    description: Enable role-segregated SQLite WAL CAS test cache for run (true/false)
    required: false
    default: "false"
  cache-dir:
    description: Override base directory for CAS DB, timings, and SQLite templates
    required: false
    default: ""
  reruns:
    description: Auto-rerun failing tests up to N times to classify flakes (ExecVerdict::Flaky)
    required: false
    default: "0"
  test-timeout:
    description: Hard per-test watchdog timeout in seconds
    required: false
    default: "60"
  metrics-kv:
    description: Emit PYRN_METRIC key=value telemetry line to stdout (true/false)
    required: false
    default: "true"
  metrics-prefix:
    description: Custom prefix for --metrics-kv output (defaults to PYRN_METRIC)
    required: false
    default: ""
  receipt-out:
    description: Path to write the bounded <= 2,048 B CompactReceipt JSON
    required: false
    default: ""
  json-out:
    description: Path to write the full RunReport JSON for run
    required: false
    default: ""
  plain:
    description: Disable ANSI colors and Unicode box borders in output (true/false)
    required: false
    default: "false"
  extra-args:
    description: Optional whitespace-separated extra pytest arguments forwarded after --
    required: false
    default: ""
  version:
    description: Release version of pyrn to install and verify (e.g. 0.2.3)
    required: false
    default: "0.2.3"
  step-summary:
    description: Append a structured Markdown summary table to GITHUB_STEP_SUMMARY (true/false)
    required: false
    default: "true"

outputs:
  exit-code:
    description: Process exit code (0 pass/flaky, 1 test failure/timeout, 2 config/operational error)
    value: ${{ steps.execute.outputs.exit-code }}
  verdict:
    description: Execution verdict from CompactReceipt (pass, flaky, failed, timed_out, config_error)
    value: ${{ steps.execute.outputs.verdict }}
  passed:
    description: Count of passed tests from CompactReceipt
    value: ${{ steps.execute.outputs.passed }}
  failed:
    description: Count of failed/errored/timed-out tests from CompactReceipt
    value: ${{ steps.execute.outputs.failed }}
  cached:
    description: Count of tests served from CAS cache
    value: ${{ steps.execute.outputs.cached }}
  skipped:
    description: Count of skipped tests
    value: ${{ steps.execute.outputs.skipped }}
  wall-ms:
    description: End-to-end wall-clock runtime in milliseconds
    value: ${{ steps.execute.outputs.wall-ms }}
  fast-path-pct:
    description: Percentage of executed tests handled by the direct fast-path
    value: ${{ steps.execute.outputs.fast-path-pct }}
  receipt-path:
    description: Path to the written CompactReceipt JSON file (when applicable)
    value: ${{ steps.execute.outputs.receipt-path }}
  coverage-path:
    description: Path to the merged --cov-sysmon coverage file (when configured)
    value: ${{ steps.execute.outputs.coverage-path }}

runs:
  using: composite
  steps:
    - name: Display pyrn banner
      id: banner
      shell: bash
      env:
        PYRN_INPUT_COMMAND: ${{ inputs.command }}
        PYRN_INPUT_VERSION: ${{ inputs.version }}
        PYRN_INPUT_WORKERS: ${{ inputs.workers }}
        PYRN_INPUT_ROLE: ${{ inputs.role }}
        PYRN_INPUT_PLAIN: ${{ inputs.plain }}
      run: |
        set -euo pipefail
        unset GITHUB_TOKEN GH_TOKEN
        if [[ -z "${NO_COLOR:-}" && "${PYRN_INPUT_PLAIN:-false}" != "true" ]]; then
          A=$'\033[38;2;230;81;0m'
          G=$'\033[38;2;255;167;38m'
          B=$'\033[1;38;2;245;245;245m'
          D=$'\033[38;2;158;158;158m'
          L=$'\033[38;2;92;64;51m'
          R=$'\033[0m'
        else
          A="" G="" B="" D="" L="" R=""
        fi
        printf '  %s\n' "${A}  ██████╗ ██╗   ██╗██████╗ ███╗   ██╗${R}"
        printf '  %s    %s\n' "${A}  ██╔══██╗╚██╗ ██╔╝██╔══██╗████╗  ██║${R}" "${B}P y R n   T e s t   E n g i n e${R}"
        printf '  %s    %s\n' "${G}  ██████╔╝ ╚████╔╝ ██████╔╝██╔██╗ ██║${R}" "${G}Rust TIA · BLAKE3 CAS · Isolated Workers${R}"
        printf '  %s    %s\n' "${G}  ██╔═══╝   ╚██╔╝  ██╔══██╗██║╚██╗██║${R}" "${L}----------------------------------------${R}"
        printf '  %s    %s\n' "${A}  ██║        ██║   ██║  ██║██║ ╚████║${R}" "${G}>${R} ${D}command: ${R} ${B}${PYRN_INPUT_COMMAND}${R}  ${D}(role=${PYRN_INPUT_ROLE}, workers=${PYRN_INPUT_WORKERS})${R}"
        printf '  %s    %s\n' "${A}  ╚═╝        ╚═╝   ╚═╝  ╚═╝╚═╝  ╚═══╝${R}" "${G}>${R} ${D}version: ${R} ${B}v${PYRN_INPUT_VERSION#v}${R}  ${D}https://dariuszpanas.github.io/pyrn/${R}"
        printf '\n'

    - name: Install and verify native pyrn binary
      id: setup
      shell: bash
      env:
        PYRN_INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        unset GITHUB_TOKEN GH_TOKEN

        VER="${PYRN_INPUT_VERSION#v}"
        if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.+-]+)?$ ]]; then
          printf '::error title=pyrn action::Invalid version format: %s\n' "$PYRN_INPUT_VERSION" >&2
          exit 2
        fi
        TAG="v${VER}"

        case "${RUNNER_OS:-Linux}:${RUNNER_ARCH:-X64}" in
          Linux:X64)     TARGET="x86_64-unknown-linux-musl";  EXT="tar.gz"; BIN_NAME="pyrn" ;;
          Linux:ARM64)   TARGET="aarch64-unknown-linux-musl"; EXT="tar.gz"; BIN_NAME="pyrn" ;;
          macOS:X64)     TARGET="x86_64-apple-darwin";        EXT="tar.gz"; BIN_NAME="pyrn" ;;
          macOS:ARM64)   TARGET="aarch64-apple-darwin";       EXT="tar.gz"; BIN_NAME="pyrn" ;;
          Windows:X64)   TARGET="x86_64-pc-windows-msvc";     EXT="zip";    BIN_NAME="pyrn.exe" ;;
          Windows:ARM64) TARGET="aarch64-pc-windows-msvc";    EXT="zip";    BIN_NAME="pyrn.exe" ;;
          *)
            printf '::error title=pyrn action::Unsupported runner platform %s/%s\n' "${RUNNER_OS:-unknown}" "${RUNNER_ARCH:-unknown}" >&2
            exit 2
            ;;
        esac

        INSTALL_DIR="${RUNNER_TEMP}/pyrn-bin-${VER}-${TARGET}"
        BIN_PATH="${INSTALL_DIR}/${BIN_NAME}"

        if [[ ! -x "$BIN_PATH" ]]; then
          mkdir -p "$INSTALL_DIR"
          STAGE_DIR="$(mktemp -d "${RUNNER_TEMP}/pyrn-dl.XXXXXX")"
          trap 'rm -rf "$STAGE_DIR"' EXIT

          ARCHIVE_NAME="pyrn-${VER}-${TARGET}.${EXT}"
          CHECKSUM_NAME="pyrn-${TAG}-sha256.txt"
          BASE_URL="https://github.com/dariuszpanas/pyrn/releases/download/${TAG}"

          curl -fsSL --retry 3 --retry-delay 2 -o "${STAGE_DIR}/${CHECKSUM_NAME}" "${BASE_URL}/${CHECKSUM_NAME}"
          curl -fsSL --retry 3 --retry-delay 2 -o "${STAGE_DIR}/${ARCHIVE_NAME}" "${BASE_URL}/${ARCHIVE_NAME}"

          EXPECTED_SHA="$(awk -v name="$ARCHIVE_NAME" '$2 == name || $2 == "*" name { print $1; exit }' "${STAGE_DIR}/${CHECKSUM_NAME}")"
          if [[ -z "$EXPECTED_SHA" ]]; then
            printf '::error title=pyrn action::Checksum entry for %s missing in %s\n' "$ARCHIVE_NAME" "$CHECKSUM_NAME" >&2
            exit 2
          fi

          if command -v sha256sum >/dev/null 2>&1; then
            ACTUAL_SHA="$(sha256sum "${STAGE_DIR}/${ARCHIVE_NAME}" | awk '{print $1}')"
          elif command -v shasum >/dev/null 2>&1; then
            ACTUAL_SHA="$(shasum -a 256 "${STAGE_DIR}/${ARCHIVE_NAME}" | awk '{print $1}')"
          else
            printf '::error title=pyrn action::Neither sha256sum nor shasum is available to verify release checksum\n' >&2
            exit 2
          fi

          if [[ "${ACTUAL_SHA,,}" != "${EXPECTED_SHA,,}" ]]; then
            printf '::error title=pyrn action::SHA-256 mismatch for %s (expected %s, got %s)\n' "$ARCHIVE_NAME" "$EXPECTED_SHA" "$ACTUAL_SHA" >&2
            exit 2
          fi

          if [[ "$EXT" == "zip" ]]; then
            if command -v unzip >/dev/null 2>&1; then
              unzip -o -q "${STAGE_DIR}/${ARCHIVE_NAME}" "$BIN_NAME" -d "$STAGE_DIR"
            else
              python3 -c 'import sys, zipfile; z=zipfile.ZipFile(sys.argv[1]); z.extract(sys.argv[2], sys.argv[3])' "${STAGE_DIR}/${ARCHIVE_NAME}" "$BIN_NAME" "$STAGE_DIR"
            fi
          else
            tar -xzf "${STAGE_DIR}/${ARCHIVE_NAME}" -C "$STAGE_DIR" "$BIN_NAME"
          fi

          mv -f "${STAGE_DIR}/${BIN_NAME}" "$BIN_PATH"
          chmod +x "$BIN_PATH"
        fi

        "$BIN_PATH" --version
        printf 'binary=%s\n' "$BIN_PATH" >> "$GITHUB_OUTPUT"
        printf '%s\n' "$INSTALL_DIR" >> "$GITHUB_PATH"

    - name: Execute pyrn
      id: execute
      shell: bash
      env:
        PYRN_BIN: ${{ steps.setup.outputs.binary }}
        PYRN_INPUT_COMMAND: ${{ inputs.command }}
        PYRN_INPUT_REPO: ${{ inputs.repo }}
        PYRN_INPUT_PYTHON: ${{ inputs.python }}
        PYRN_INPUT_WORKERS: ${{ inputs.workers }}
        PYRN_INPUT_ROLE: ${{ inputs.role }}
        PYRN_INPUT_TIER: ${{ inputs.tier }}
        PYRN_INPUT_MARKERS: ${{ inputs.markers }}
        PYRN_INPUT_KEYWORD: ${{ inputs.keyword }}
        PYRN_INPUT_CONFIG_FILE: ${{ inputs.config-file }}
        PYRN_INPUT_TARGETS: ${{ inputs.targets }}
        PYRN_INPUT_COV_SYSMON: ${{ inputs.cov-sysmon }}
        PYRN_INPUT_COV_OUT: ${{ inputs.cov-out }}
        PYRN_INPUT_TIA: ${{ inputs.tia }}
        PYRN_INPUT_BASE: ${{ inputs.base }}
        PYRN_INPUT_CHANGED: ${{ inputs.changed }}
        PYRN_INPUT_CACHE: ${{ inputs.cache }}
        PYRN_INPUT_CACHE_DIR: ${{ inputs.cache-dir }}
        PYRN_INPUT_RERUNS: ${{ inputs.reruns }}
        PYRN_INPUT_TEST_TIMEOUT: ${{ inputs.test-timeout }}
        PYRN_INPUT_METRICS_KV: ${{ inputs.metrics-kv }}
        PYRN_INPUT_METRICS_PREFIX: ${{ inputs.metrics-prefix }}
        PYRN_INPUT_RECEIPT_OUT: ${{ inputs.receipt-out }}
        PYRN_INPUT_JSON_OUT: ${{ inputs.json-out }}
        PYRN_INPUT_PLAIN: ${{ inputs.plain }}
        PYRN_INPUT_EXTRA_ARGS: ${{ inputs.extra-args }}
        PYRN_INPUT_STEP_SUMMARY: ${{ inputs.step-summary }}
      run: |
        set -euo pipefail
        unset GITHUB_TOKEN GH_TOKEN

        to_native_path() {
          if command -v cygpath >/dev/null 2>&1; then
            cygpath -w "$1"
          else
            printf '%s' "$1"
          fi
        }

        CMD=("$PYRN_BIN")
        if [[ "${PYRN_INPUT_PLAIN:-false}" == "true" ]]; then
          CMD+=(--plain)
        fi

        RECEIPT_PATH=""
        CLEAN_TEMP_RECEIPT=0

        case "$PYRN_INPUT_COMMAND" in
          run)
            CMD+=(run --repo "$PYRN_INPUT_REPO" --role "$PYRN_INPUT_ROLE" --tier "$PYRN_INPUT_TIER" --workers "$PYRN_INPUT_WORKERS")
            if [[ -n "$PYRN_INPUT_PYTHON" ]]; then CMD+=(--python "$PYRN_INPUT_PYTHON"); fi
            if [[ -n "$PYRN_INPUT_MARKERS" ]]; then CMD+=(-m "$PYRN_INPUT_MARKERS"); fi
            if [[ -n "$PYRN_INPUT_KEYWORD" ]]; then CMD+=(-k "$PYRN_INPUT_KEYWORD"); fi
            if [[ -n "$PYRN_INPUT_CONFIG_FILE" ]]; then CMD+=(-c "$PYRN_INPUT_CONFIG_FILE"); fi
            if [[ "$PYRN_INPUT_COV_SYSMON" == "true" ]]; then CMD+=(--cov-sysmon); fi
            if [[ -n "$PYRN_INPUT_COV_OUT" ]]; then CMD+=(--cov-out "$PYRN_INPUT_COV_OUT"); fi
            if [[ "$PYRN_INPUT_TIA" == "true" ]]; then CMD+=(--tia); fi
            if [[ -n "$PYRN_INPUT_BASE" ]]; then CMD+=(--base "$PYRN_INPUT_BASE"); fi
            if [[ -n "$PYRN_INPUT_CHANGED" ]]; then CMD+=(--changed "$PYRN_INPUT_CHANGED"); fi
            if [[ "$PYRN_INPUT_CACHE" == "true" ]]; then CMD+=(--cache); fi
            if [[ -n "$PYRN_INPUT_CACHE_DIR" ]]; then CMD+=(--cache-dir "$PYRN_INPUT_CACHE_DIR"); fi
            if [[ -n "$PYRN_INPUT_RERUNS" && "$PYRN_INPUT_RERUNS" != "0" ]]; then CMD+=(--reruns "$PYRN_INPUT_RERUNS"); fi
            if [[ -n "$PYRN_INPUT_TEST_TIMEOUT" ]]; then CMD+=(--test-timeout "$PYRN_INPUT_TEST_TIMEOUT"); fi
            if [[ "$PYRN_INPUT_METRICS_KV" == "true" ]]; then CMD+=(--metrics-kv); fi
            if [[ -n "$PYRN_INPUT_METRICS_PREFIX" ]]; then CMD+=(--metrics-prefix "$PYRN_INPUT_METRICS_PREFIX"); fi
            if [[ -n "$PYRN_INPUT_JSON_OUT" ]]; then CMD+=(--json-out "$PYRN_INPUT_JSON_OUT"); fi

            if [[ -n "$PYRN_INPUT_RECEIPT_OUT" ]]; then
              RECEIPT_PATH="$PYRN_INPUT_RECEIPT_OUT"
            else
              RECEIPT_PATH="${RUNNER_TEMP}/pyrn-receipt-$$-${RANDOM}.json"
              CLEAN_TEMP_RECEIPT=1
            fi
            CMD+=(--receipt-out "$(to_native_path "$RECEIPT_PATH")")

            if [[ -n "$PYRN_INPUT_TARGETS" ]]; then
              set -f
              while IFS= read -r line; do
                [[ -z "$line" ]] && continue
                read -r -a line_parts <<< "$line"
                CMD+=("${line_parts[@]}")
              done <<< "$PYRN_INPUT_TARGETS"
              set +f
            fi
            if [[ -n "$PYRN_INPUT_EXTRA_ARGS" ]]; then
              set -f
              read -r -a extra_parts <<< "$PYRN_INPUT_EXTRA_ARGS"
              set +f
              if [[ ${#extra_parts[@]} -gt 0 ]]; then
                CMD+=(-- "${extra_parts[@]}")
              fi
            fi
            ;;

          plan)
            CMD+=(plan --repo "$PYRN_INPUT_REPO" --role "$PYRN_INPUT_ROLE" --tier "$PYRN_INPUT_TIER")
            if [[ -n "$PYRN_INPUT_BASE" ]]; then CMD+=(--base "$PYRN_INPUT_BASE"); fi
            if [[ -n "$PYRN_INPUT_CHANGED" ]]; then CMD+=(--changed "$PYRN_INPUT_CHANGED"); fi
            if [[ "$PYRN_INPUT_METRICS_KV" == "true" ]]; then CMD+=(--metrics-kv); fi
            if [[ -n "$PYRN_INPUT_METRICS_PREFIX" ]]; then CMD+=(--metrics-prefix "$PYRN_INPUT_METRICS_PREFIX"); fi

            if [[ -n "$PYRN_INPUT_RECEIPT_OUT" ]]; then
              RECEIPT_PATH="$PYRN_INPUT_RECEIPT_OUT"
            else
              RECEIPT_PATH="${RUNNER_TEMP}/pyrn-plan-receipt-$$-${RANDOM}.json"
              CLEAN_TEMP_RECEIPT=1
            fi
            CMD+=(--receipt-out "$(to_native_path "$RECEIPT_PATH")")
            ;;

          doctor)
            CMD+=(doctor --repo "$PYRN_INPUT_REPO" --role "$PYRN_INPUT_ROLE")
            if [[ -n "$PYRN_INPUT_PYTHON" ]]; then CMD+=(--python "$PYRN_INPUT_PYTHON"); fi
            if [[ -n "$PYRN_INPUT_CACHE_DIR" ]]; then CMD+=(--cache-dir "$PYRN_INPUT_CACHE_DIR"); fi
            ;;

          config)
            CMD+=(config show --repo "$PYRN_INPUT_REPO")
            ;;

          *)
            printf '::error title=pyrn action::Unsupported command "%s" (expected run, plan, doctor, or config)\n' "$PYRN_INPUT_COMMAND" >&2
            printf 'exit-code=2\n' >> "$GITHUB_OUTPUT"
            exit 2
            ;;
        esac

        set +e
        "${CMD[@]}"
        STATUS=$?
        set -e

        printf 'exit-code=%s\n' "$STATUS" >> "$GITHUB_OUTPUT"
        printf 'coverage-path=%s\n' "$PYRN_INPUT_COV_OUT" >> "$GITHUB_OUTPUT"
        if [[ -n "$PYRN_INPUT_RECEIPT_OUT" && -f "$RECEIPT_PATH" ]]; then
          printf 'receipt-path=%s\n' "$RECEIPT_PATH" >> "$GITHUB_OUTPUT"
        else
          printf 'receipt-path=\n' >> "$GITHUB_OUTPUT"
        fi

        VERDICT="" PASSED="" FAILED="" CACHED="" SKIPPED="" WALL_MS="" FP_PCT=""
        if [[ -n "$RECEIPT_PATH" && -f "$RECEIPT_PATH" ]]; then
          PY_EXE="$(command -v python3 || command -v python || true)"
          if [[ -n "$PY_EXE" ]]; then
            while IFS='=' read -r k v; do
              case "$k" in
                VERDICT) VERDICT="$v" ;;
                PASSED)  PASSED="$v" ;;
                FAILED)  FAILED="$v" ;;
                CACHED)  CACHED="$v" ;;
                SKIPPED) SKIPPED="$v" ;;
                WALL_MS) WALL_MS="$v" ;;
                FP_PCT)  FP_PCT="$v" ;;
              esac
            done < <("$PY_EXE" -c '
        import json, sys
        try:
            with open(sys.argv[1], "r", encoding="utf-8") as fh:
                d = json.load(fh)
            total = int(d.get("tests_total", 0) or 0)
            fp = int(d.get("fast_path_tests", 0) or 0)
            fp_pct = f"{(fp / total) * 100.0:.1f}" if total > 0 else "0.0"
            for k, v in (
                ("VERDICT", str(d.get("verdict", ""))),
                ("PASSED", str(d.get("tests_passed", 0))),
                ("FAILED", str(d.get("tests_failed", 0))),
                ("CACHED", str(d.get("tests_cached", 0))),
                ("SKIPPED", str(d.get("tests_skipped", 0))),
                ("WALL_MS", str(d.get("wall_ms", 0))),
                ("FP_PCT", fp_pct),
            ):
                clean = v.replace(chr(10), " ").replace(chr(13), "")
                print(f"{k}={clean}")
        except Exception:
            pass
        ' "$(to_native_path "$RECEIPT_PATH")")
          fi
        fi

        printf 'verdict=%s\n' "$VERDICT" >> "$GITHUB_OUTPUT"
        printf 'passed=%s\n' "$PASSED" >> "$GITHUB_OUTPUT"
        printf 'failed=%s\n' "$FAILED" >> "$GITHUB_OUTPUT"
        printf 'cached=%s\n' "$CACHED" >> "$GITHUB_OUTPUT"
        printf 'skipped=%s\n' "$SKIPPED" >> "$GITHUB_OUTPUT"
        printf 'wall-ms=%s\n' "$WALL_MS" >> "$GITHUB_OUTPUT"
        printf 'fast-path-pct=%s\n' "$FP_PCT" >> "$GITHUB_OUTPUT"

        if [[ "${PYRN_INPUT_STEP_SUMMARY:-true}" == "true" && -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
          BADGE="PASS"
          if [[ "$STATUS" -eq 1 ]]; then BADGE="FAIL"; elif [[ "$STATUS" -ne 0 ]]; then BADGE="ERROR"; fi
          {
            printf '### pyrn `%s` — **%s** (exit `%s`)\n\n' "$PYRN_INPUT_COMMAND" "$BADGE" "$STATUS"
            if [[ -n "$VERDICT" ]]; then
              WALL_S="$(awk -v ms="${WALL_MS:-0}" 'BEGIN { printf "%.2fs", ms / 1000.0 }')"
              printf '| Verdict | Passed | Cached | Failed | Skipped | Wall | Fast-path |\n'
              printf '| :--- | ---: | ---: | ---: | ---: | ---: | ---: |\n'
              printf '| `%s` | %s | %s | %s | %s | %s | %s%% |\n\n' \
                "$VERDICT" "${PASSED:-0}" "${CACHED:-0}" "${FAILED:-0}" "${SKIPPED:-0}" "$WALL_S" "${FP_PCT:-0.0}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        fi

        if [[ "$CLEAN_TEMP_RECEIPT" -eq 1 && -f "$RECEIPT_PATH" ]]; then
          rm -f "$RECEIPT_PATH"
        fi

        exit "$STATUS"

branding:
  icon: zap
  color: orange
